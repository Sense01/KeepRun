<script>
const $=s=>document.querySelector(s);
let acts=[];try{acts=JSON.parse(localStorage.getItem('keeprun')||'[]')}catch(e){}
const ATTR='© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
const idbP=new Promise(res=>{try{const r=indexedDB.open('keeprun',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}});
const idbGet=async k=>{const d=await idbP;if(!d)return;return new Promise(res=>{try{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res()}catch(e){res()}})};
const idbSet=async(k,v)=>{const d=await idbP;if(!d)return false;return new Promise(res=>{try{const t=d.transaction('kv','readwrite');v==null?t.objectStore('kv').delete(k):t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})};
const loaded=window.KR_loaded=(async()=>{const s=await idbGet('acts');if(Array.isArray(s)){const ids=new Set(acts.map(a=>String(a.id)));let n=0;s.forEach(a=>{if(!ids.has(String(a.id))){acts.push(a);n++}});if(n&&window.renderList)renderList()}})();
let warned=0;
const saveLocal=window.KR_saveLocal=()=>loaded.then(()=>idbSet('acts',acts)).then(ok=>{if(ok){try{localStorage.removeItem('keeprun')}catch(e){}if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}else{try{localStorage.setItem('keeprun',JSON.stringify(acts))}catch(e){if(!warned++)alert('Sem espaço para guardar. Exporta e apaga atividades antigas.')}}});
const save=()=>{saveLocal();window.KR_sync&&window.KR_sync()};
const R=Math.PI/180,num=window.num=x=>{x=Number(x);return isFinite(x)?x:0};
const splitCSV=window.splitCSV=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o};
const hav=(a,b)=>{const dl=(b[0]-a[0])*R,dn=(b[1]-a[1])*R,x=Math.sin(dl/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
function calc(p){let d=0,g=0,ref=null;for(let i=0;i<p.length;i++){if(i)d+=hav(p[i-1],p[i]);const e=p[i][2];if(e==null||!isFinite(e))continue;if(ref==null)ref=e;else if(e-ref>=3){g+=e-ref;ref=e}else if(ref-e>=3)ref=e}
const t=p.length>1?(p[p.length-1][3]-p[0][3])/1000:0;return{dist:d,dur:t,elev:g}}
function thin(p){const o=[],r=(x,n)=>Math.round(x*n)/n;let l=null;p.forEach((q,i)=>{const e=q[2]==null||!isFinite(q[2])?null:r(q[2],10),pt=[r(q[0],1e5),r(q[1],1e5),e,q[3]];
if(!l||i===p.length-1||hav(l,pt)>=4||q[3]-l[3]>=10000){o.push(pt);l=pt}});return o}
const fT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,z=n=>String(n).padStart(2,'0');return(h?h+':':'')+z(m)+':'+z(c)}
const fP=(d,t)=>d>0?fT(t/(d/1000))+'/km':'--';
const fV=(d,t)=>t>0?(d/t*3.6).toFixed(1)+' km/h':'--';
const pace=a=>a.type==='Bicicleta'?fV(a.dist,a.dur):fP(a.dist,a.dur);
const fD=ts=>new Date(ts).toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function parseGPX(txt,fn){const x=new DOMParser().parseFromString(txt,'text/xml');const pts=[];
x.querySelectorAll('trkpt').forEach(n=>{const la=parseFloat(n.getAttribute('lat')),lo=parseFloat(n.getAttribute('lon'));if(!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180)return;const t=n.querySelector('time'),el=n.querySelector('ele'),ev=el?parseFloat(el.textContent):NaN,tv=t?Date.parse(t.textContent):0;pts.push([la,lo,isFinite(ev)?ev:null,isFinite(tv)?tv:0])});
if(pts.length<2)throw new Error('GPX sem pontos');
const ty=(x.querySelector('trk > type')?.textContent||'').trim().toLowerCase(),sp=window.KRW&&KRW.SPORTS.find(z=>z.toLowerCase()===ty);
const type=sp||(/bik|cycl|ride/.test(ty)?'Bicicleta':/walk|hik/.test(ty)?'Caminhada':'Corrida'),c=calc(pts);
return{id:Date.now()+Math.random(),name:(x.querySelector('trk > name')?.textContent||fn.replace(/\.gpx$/i,'')).slice(0,80),type,date:pts[0][3]||Date.now(),pts:thin(pts.slice(0,50000)),...c}}
$('#file').onchange=async e=>{for(const f of e.target.files){try{if(/\.csv$/i.test(f.name)){if(window.KRPro&&KRPro.importStravaCSV){const n=KRPro.importStravaCSV(await f.text());toast(`${n} atividade(s) do Strava importada(s)!`)}else throw new Error('Módulo Strava não carregado')}else acts.push(/\.tcx$/i.test(f.name)?parseTCX(await f.text(),f.name):parseGPX(await f.text(),f.name))}catch(x){alert(f.name+': '+x.message)}}

const ls=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ICON={Corrida:'🏃',Bicicleta:'🚴',Caminhada:'🥾'};let flt='Todas',goal=Math.max(1,+ls('kr_goal',20)||20);
const ini=()=>(ls('kr_name','Atleta')[0]||'A').toUpperCase();
const hello=()=>document.querySelectorAll('.av.me,.avt').forEach(e=>e.textContent=ini());
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)};
const wkStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function thumb(pts){
const st=Math.max(1,Math.floor(pts.length/120)),q=pts.filter((_,i)=>i%st===0||i===pts.length-1);
const lats=q.map(p=>+p[0]),lons=q.map(p=>+p[1]),minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
const W=600,H=300,xT=(lo,z)=>((lo+180)/360)*(1<<z),yT=(la,z)=>{const s=Math.sin(Math.max(-85,Math.min(85,la))*R);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*(1<<z)};
let z=15;for(let tz=16;tz>=10;tz--){const sx=(xT(maxLon,tz)-xT(minLon,tz))*256,sy=(yT(minLat,tz)-yT(maxLat,tz))*256;if(sx<=W*0.74&&sy<=H*0.74){z=tz;break}z=tz}
const cx=((xT(minLon,z)+xT(maxLon,z))/2)*256,cy=((yT(minLat,z)+yT(maxLat,z))/2)*256,vx0=Math.round(cx-W/2),vy0=Math.round(cy-H/2),nT=1<<z;
const tx0=Math.floor(vx0/256),tx1=Math.floor((vx0+W)/256),ty0=Math.floor(vy0/256),ty1=Math.floor((vy0+H)/256);
let tiles='';for(let tx=tx0;tx<=tx1;tx++)for(let ty=ty0;ty<=ty1;ty++){if(ty<0||ty>=nT)continue;const wx=((tx%nT)+nT)%nT;tiles+=`<image href="https://tile.openstreetmap.org/${z}/${wx}/${ty}.png" x="${tx*256-vx0}" y="${ty*256-vy0}" width="256.5" height="256.5" preserveAspectRatio="none"/>`}
const P=q.map(p=>[(xT(p[1],z)*256-vx0),(yT(p[0],z)*256-vy0)]),ptsStr=P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
return `<svg class="th" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><g class="leaflet-tile-pane">${tiles}</g><polyline fill="none" stroke="#000" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="${ptsStr}"/><polyline fill="none" stroke="#fc4c02" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${ptsStr}"/><circle cx="${P[0][0].toFixed(1)}" cy="${P[0][1].toFixed(1)}" r="5.5" fill="#3ddc84" stroke="#000" stroke-width="1.8"/><circle cx="${P[P.length-1][0].toFixed(1)}" cy="${P[P.length-1][1].toFixed(1)}" r="5.5" fill="#fff" stroke="#fc4c02" stroke-width="2.2"/></svg>`}
const FL='<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>';
const IC={thumb:'<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8c2 0 3 1 3 3l-.5 3H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 11v10h14V11"/></svg>'};
const fTL=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h?`${h}h ${m}m`:`${m}m ${c}s`};
const fDT=t=>new Date(t).toLocaleString('pt-PT',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const wkId=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function streakW(){const S=new Set(acts.map(a=>wkId(a.date)));let w=wkId(Date.now()),n=0;if(!S.has(w))w=wkId(w-36e5*24*3);while(S.has(w)){n++;w=wkId(w-36e5*24*3)}return n}
const ach=a=>{const lg=acts.reduce((m,x)=>x.dist>m.dist?x:m,acts[0]);return (a.dist>=5000)+(a.dist>=10000)+(a.dist>=21100)+(a===lg&&acts.length>1&&a.dist>0)};
function cal(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
const has=new Set(acts.filter(a=>{const d=new Date(a.date);return d.getFullYear()===y&&d.getMonth()===m}).map(a=>new Date(a.date).getDate()));
let h='<div class="card" style="border-radius:0;margin-bottom:8px"><b>'+n.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})+'</b><div class="cg">'+['S','T','Q','Q','S','S','D'].map(d=>`<u>${d}</u>`).join('')+'<s></s>'.repeat(f);
for(let d=1;d<=dim;d++)h+=`<span class="${has.has(d)?'on':''}">${d}</span>`;return h+'</div></div>'}
function renderWeek(){const w0=wkStart(),wa=acts.filter(a=>a.date>=w0),km=wa.reduce((q,a)=>q+a.dist,0)/1000,sw=streakW(),dur=wa.reduce((q,a)=>q+a.dur,0);
$('#wk').innerHTML=`<div class="card" style="padding:12px 14px;margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div id="goal" style="cursor:pointer;flex:1" title="Toca para editar meta semanal">
      <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap"><b class="big" style="font-size:20px">${km.toFixed(1)}</b><span class="mu" style="font-size:13px">/ ${goal} km semana · ${wa.length} treino${wa.length===1?'':'s'}${dur?' · '+fTL(dur):''}</span></div>

  </div>
</div><div id="cal" class="hide"></div>`;
$('#vc').onclick=()=>{const c=$('#cal');c.innerHTML=cal();c.classList.toggle('hide')};
$('#goal').onclick=()=>{const v=+prompt('Meta semanal (km)',goal);if(v>0){goal=v;ss('kr_goal',v);renderWeek();window.renderWP&&renderWP()}}}
function renderCards(){const l=$('#list');acts.sort((a,b)=>b.date-a.date);const q=($('#q').value||'').toLowerCase(),nm=esc(ls('kr_name','Atleta'));
const f=acts.filter(a=>a.name.toLowerCase().includes(q));

${a.pts&&a.pts.length>1?`<div class="mapbox">${thumb(a.pts)}</div>`:''}
<div class="kd">${kCount?`🔥 <b>${kCount} ${kCount===1?'Keep':'Keeps'}</b> · ${kNames.slice(0,5).map(esc).join(', ')}${kNames.length>5?'…':''}`:'Sê o primeiro a dar um Keep!'}</div><div class="cm" style="cursor:pointer">${(a.c||[]).slice(0,3).map(x=>`<p><b>${nm}</b> ${esc(x)}</p>`).join('')}${window.KR_social?KR_social(a):''}${cCount?`<div class="mu" style="margin-top:4px;font-size:12px;color:var(--ac2)">💬 Ver secção de comentários (${cCount}) — responder, apagar ou dar like ›</div>`:''}</div>
<div class="ac"><button class="lk ${myKeep?'on':''}" aria-label="Dar Keep">${IC.thumb}<span>${kCount?kCount+' ':''}${kCount===1?'Keep':'Keeps'}</span></button><button class="cmt" aria-label="Comentar">${IC.chat}<span>${cCount?'Comentar ('+cCount+')':'Comentar'}</span></button><button class="shr" aria-label="Partilhar">${IC.share}<span>Partilhar</span></button></div>`;

else if(k==='kr_mfp'){try{const m=JSON.parse(v);if(m&&isFinite(+m.food)&&isFinite(+m.goal))ss(k,v)}catch(x){}}
else if(k==='kr_sleep'){try{const s=JSON.parse(v);if(s&&isFinite(+s.hours))ss(k,v)}catch(x){}}
else if(k==='kr_prof'||k==='kr_plan_done'){try{const o=JSON.parse(v);if(o&&typeof o==='object'&&!Array.isArray(o))ss(k,v)}catch(x){}}
else if(['kr_goals','kr_segs','kr_off_routes','kr_strava_profs'].includes(k)){try{if(Array.isArray(JSON.parse(v)))ss(k,v)}catch(x){}}
else if(k==='kr_plan'){if(/^p_[a-z0-9_]{1,15}$/i.test(v))ss(k,v)}
else if(k==='kr_name'){ss(k,v.slice(0,30))}});
save();renderList();renderStats();hello();toast(n+' atividade'+(n===1?'':'s')+' importada'+(n===1?'':'s'))}catch(x){alert('Ficheiro inválido.')}};
$('#pv').onclick=()=>window.KR_policy&&KR_policy()}
hello();renderList();
['gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,e=>{if(!e.target.closest?.('.leaflet-container'))e.preventDefault()},{passive:false}));
document.addEventListener('touchmove',e=>{if(!e.target.closest?.('.leaflet-container')&&((e.touches&&e.touches.length>1)||(e.scale&&e.scale!==1)||(document.documentElement.classList.contains('in-rec')&&!e.target.closest?.('.ov'))))e.preventDefault()},{passive:false});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(()=>{const sp=$('#splash');let done=0;const end=()=>{if(done)return;done=1;sp.classList.add('out');setTimeout(()=>sp.remove(),700)};
sp.onclick=end;setTimeout(end,2800)})();
(()=>{const T=$('#tabs');
const sa=()=>navigator.standalone||matchMedia('(display-mode: standalone)').matches;
const fix=()=>{if(!sa()||!matchMedia('(max-width:899px)').matches||document.documentElement.classList.contains('in-rec')){T.style.top=T.style.bottom='';return}
const H=innerHeight>innerWidth?Math.max(screen.width,screen.height):Math.min(screen.width,screen.height);
T.style.bottom='auto';T.style.top=(H-T.offsetHeight)+'px'};
['load','resize','orientationchange','scroll','pageshow'].forEach(e=>addEventListener(e,fix,{passive:true}));
if(window.visualViewport)visualViewport.addEventListener('resize',fix);
[0,300,1000,2500].forEach(t=>setTimeout(fix,t));window.fixBar=fix})();
</script>
