<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fc4c02">
<title>KeepRun</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0d0d0d;--card:#171717;--tx:#fff;--mu:#a3a3a3;--ac:#fc4c02;--bd:#2c2c2c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1000}
h1{margin:0;font-size:20px;color:var(--ac)}nav{display:flex;gap:4px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:90px}
.big{font-size:22px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.act{cursor:pointer}.act:hover{border-color:var(--ac)}
#map,#rmap{height:260px;border-radius:10px;margin:10px 0}
canvas{width:100%;height:110px}
.bar{display:flex;align-items:flex-end;gap:6px;height:120px}.bar div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
select,input{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--bd)}
.hide{display:none}

main{max-width:1100px}
header{z-index:1100;padding-top:calc(12px + env(safe-area-inset-top))}
#splash{position:fixed;inset:0;z-index:9999;background:#fc4c02;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s,visibility .5s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:min(70vw,300px);overflow:visible}
#splash path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s ease forwards .2s}
#splash circle{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease forwards 1.5s}
#splash h2{font-size:clamp(36px,9vw,60px);margin:18px 0 0;letter-spacing:1px;opacity:0;transform:translateY(14px);animation:up .6s ease forwards 1.1s}
#splash p{margin:6px 0 0;opacity:0;transform:translateY(14px);animation:up .6s ease forwards 1.5s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes up{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
@media(min-width:900px){#list{display:grid;grid-template-columns:1fr 1fr;gap:12px}#list .card{margin:0}#map{height:400px}#rmap{height:440px}main{padding:24px}}
@media(max-width:640px){header{justify-content:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:6px}
nav button{flex:1;border:0;padding:12px 4px}main{padding:12px 12px 96px}.big{font-size:19px}.btn{padding:11px 14px}}

#tabs{position:fixed;z-index:1100;display:flex;background:var(--card);border-top:1px solid var(--bd);left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mu);font:11px system-ui,sans-serif;padding:6px 2px;cursor:pointer;border-radius:10px}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--ac)}#tabs button.recb{color:var(--ac)}
#tabs button.recb svg{width:44px;height:44px;background:var(--ac);stroke:#fff;border-radius:50%;padding:9px;margin-top:-20px;box-shadow:0 4px 12px #fc4c0266}
header{justify-content:space-between;z-index:1200}
.badge{width:38px;height:38px;border-radius:50%;background:#fc4c0222;display:grid;place-items:center;font-size:20px;flex:none}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.mid{display:flex;gap:10px;align-items:center}.mid .row{flex:1}
.th{width:96px;height:96px;background:var(--bg);border-radius:10px;flex:none}
.acts{margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
.lk{border:0;background:none;color:var(--mu);font:inherit;cursor:pointer;padding:4px 8px;border-radius:8px}.lk.on{color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:20px;cursor:pointer;font:inherit;white-space:nowrap}.chip.on{background:var(--tx);color:var(--bg)}
.prog{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .8s}
.bar.mini{height:50px;margin-bottom:22px}.bar.mini div{background:#fc4c0299}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.bdg{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;text-align:center;font-size:26px;opacity:.5;filter:grayscale(1)}
.bdg.on{opacity:1;filter:none;border-color:var(--ac)}.bdg span{display:block;font-size:12px;margin-top:6px}
#amap{height:calc(100vh - 190px);min-height:320px;border-radius:12px}
main>section:not(.hide){animation:fi .35s both}
.act{animation:fi .4s both;transition:transform .15s,box-shadow .15s}.act:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:899px){main{padding-bottom:100px}}
@media(min-width:900px){#tabs{top:0;bottom:auto;right:auto;height:100vh;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--bd);padding:72px 10px 10px;gap:4px}
#tabs button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;justify-content:flex-start}
#tabs button.on{background:#fc4c0218}
#tabs button.recb svg{width:30px;height:30px;margin:0;padding:5px;box-shadow:none}
main{margin:0 auto 0 200px;max-width:1000px}#amap{height:calc(100vh - 120px)}}

header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
header h1{font-size:22px;text-align:center}
.hl,.hr{display:flex;gap:14px;align-items:center}.hr{justify-content:flex-end}
.ib{background:none;border:0;color:var(--tx);padding:2px;cursor:pointer;display:grid;place-items:center}
.ib svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:3000;font-size:14px}#toast.on{opacity:1}
#sbar{margin-bottom:10px}#sbar input{width:100%;background:var(--card)}
#tabs button.recb{color:#fff}
#tabs button.recb svg{width:28px;height:28px;background:none;stroke:#fff;border-radius:0;padding:0;margin:0;box-shadow:none;stroke-width:2.2}
#tabs button[data-v=feed].on svg{fill:currentColor}
.avt{width:28px;height:28px;border-radius:50%;background:#9a9a9a;color:#222;display:grid;place-items:center;font-weight:700;font-size:14px}
#tabs button.on .avt{outline:2px solid var(--ac)}
@media(max-width:899px){#tabs button{font-size:12px;font-weight:600}}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
#feed{max-width:640px;margin:0 auto}#list{display:block!important}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--card);scrollbar-width:none;border-radius:12px 12px 0 0}.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;padding:18px 18px 8px;min-height:190px}
.sh{display:flex;justify-content:space-between;margin-bottom:16px}.sh a{color:var(--ac);font-weight:600;cursor:pointer}
.stk{display:flex;align-items:center;gap:16px}.stk .tx{flex:1;font-size:16px}
.fl{text-align:center;color:#555}.fl.on{color:var(--ac)}.fi{position:relative;display:inline-block}
.fi svg{width:60px;height:60px;fill:currentColor;display:block}.fi b{position:absolute;top:62%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:22px}
.dots{display:flex;gap:10px;justify-content:center;background:var(--card);padding:6px 0 18px;margin-bottom:8px;border-radius:0 0 12px 12px}
.dots i{width:9px;height:9px;border-radius:50%;background:#555}.dots i.on{background:#fff}
.post{background:var(--card);margin:0 0 8px;padding:16px 16px 6px;border-radius:12px;animation:fi .4s both}
.ph{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:#9a9a9a;color:#222;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.pm b{font-size:16px}.pm .mu{font-size:14px;color:var(--tx);opacity:.85}
.post h2{font-size:26px;margin:18px 0 14px;cursor:pointer}
.ps{display:flex;gap:22px;margin-bottom:16px}.ps span{display:block;font-size:14px;opacity:.85}.ps b{font-size:22px}.ps .r{margin-left:auto;text-align:right}
.mapbox{margin:0 -16px;height:300px;cursor:pointer;background:repeating-radial-gradient(circle at 30% 40%,#242424 0 2px,#1b1b1b 2px 14px)}
.mapbox .th{width:100%;height:100%;background:none;border-radius:0}
.kd{padding:18px 0 6px;font-size:14px}.cm p{margin:4px 0;font-size:14px}
.ac{display:flex;justify-content:space-between;padding:8px 28px 12px}
.ac button{background:none;border:0;color:var(--tx);cursor:pointer;padding:4px}.ac button.on{color:var(--ac)}
.ac svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}.cg u{text-decoration:none;color:var(--mu)}
.cg span{padding:6px 0;border-radius:50%}.cg span.on{background:var(--ac)}
@media(max-width:640px){#feed{margin:-12px -12px 0}.post,.car,.dots{border-radius:0}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 300 120"><path pathLength="600" d="M10 100 C50 100 60 30 100 40 S150 100 190 70 S250 20 285 30"/><circle cx="285" cy="30" r="9"/></svg><h2>KeepRun</h2><p>Corre. Regista. Evolui.</p></div>
<header><div class="hl"><label class="ib" title="Importar GPX"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><input id="file" type="file" accept=".gpx" multiple hidden></label><button class="ib" id="sb" title="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg></button></div><h1>KeepRun</h1><div class="hr"><button class="ib" id="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></button><button class="ib" id="bell"><svg viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg></button></div></header>
<div id="tabs"><button data-v="feed" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Início</button><button data-v="maps"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>Mapas</button><button data-v="rec" class="recb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.5" fill="currentColor"/></svg>Gravar</button><button data-v="groups"><svg viewBox="0 0 24 24"><path d="M8 3l5 5-5 5-5-5zM16 11l5 5-5 5-5-5z"/></svg>Grupos</button><button data-v="stats"><span class="avt"></span>Eu</button></div>
<div id="toast"></div>
<main>
<section id="feed"><div id="sbar" class="hide"><input id="q" placeholder="Pesquisar atividades"></div><div id="wk"></div><div id="list"></div></section>
<section id="detail" class="hide"></section>
<section id="rec" class="hide"><div class="card">
<select id="rtype"><option>Corrida</option><option>Bicicleta</option><option>Caminhada</option></select>
<div id="rmap"></div>
<div class="row"><div><div class="big" id="rd">0.00</div><div class="mu">km</div></div><div><div class="big" id="rt">00:00</div><div class="mu">tempo</div></div><div><div class="big" id="rp">--</div><div class="mu">ritmo</div></div></div>
<p><button class="btn pri" id="rstart">Iniciar</button> <button class="btn hide" id="rstop">Terminar e guardar</button></p>
<p class="mu">Usa o GPS do dispositivo. Mantém o ecrã ligado durante a gravação.</p></div></section>
<section id="stats" class="hide"></section>
<section id="maps" class="hide"><div id="amap"></div></section>
<section id="groups" class="hide"></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let acts=[];try{acts=JSON.parse(localStorage.getItem('keeprun')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('keeprun',JSON.stringify(acts))}catch(e){alert('Armazenamento cheio')}};
const R=Math.PI/180;
const hav=(a,b)=>{const dl=(b[0]-a[0])*R,dn=(b[1]-a[1])*R,x=Math.sin(dl/2)**2+Math.cos(a[0]*R)*Math.cos(b[0]*R)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
function calc(p){let d=0,g=0;for(let i=1;i<p.length;i++){d+=hav(p[i-1],p[i]);const e=(p[i][2]||0)-(p[i-1][2]||0);if(e>0.5)g+=e}
const t=p.length>1?(p[p.length-1][3]-p[0][3])/1000:0;return{dist:d,dur:t,elev:g}}
const fT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60,z=n=>String(n).padStart(2,'0');return(h?h+':':'')+z(m)+':'+z(c)}
const fP=(d,t)=>d>0?fT(t/(d/1000))+'/km':'--';
const fV=(d,t)=>t>0?(d/t*3.6).toFixed(1)+' km/h':'--';
const pace=a=>a.type==='Bicicleta'?fV(a.dist,a.dur):fP(a.dist,a.dur);
const fD=ts=>new Date(ts).toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function parseGPX(txt,fn){const x=new DOMParser().parseFromString(txt,'text/xml');const pts=[];
x.querySelectorAll('trkpt').forEach(n=>{const t=n.querySelector('time');pts.push([+n.getAttribute('lat'),+n.getAttribute('lon'),+(n.querySelector('ele')?.textContent||0),t?Date.parse(t.textContent):0])});
if(pts.length<2)throw new Error('GPX sem pontos');
const ty=(x.querySelector('trk > type')?.textContent||'').toLowerCase();
const type=/bik|cycl|ride/.test(ty)?'Bicicleta':/walk|hik/.test(ty)?'Caminhada':'Corrida';
return{id:Date.now()+Math.random(),name:x.querySelector('trk > name')?.textContent||fn.replace(/\.gpx$/i,''),type,date:pts[0][3]||Date.now(),pts,...calc(pts)}}
$('#file').onchange=async e=>{for(const f of e.target.files){try{acts.push(parseGPX(await f.text(),f.name))}catch(x){alert(f.name+': '+x.message)}}
save();e.target.value='';renderList()};
const ls=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ICON={Corrida:'🏃',Bicicleta:'🚴',Caminhada:'🥾'};let flt='Todas',goal=+ls('kr_goal',20);
const ini=()=>(ls('kr_name','Atleta')[0]||'A').toUpperCase();
const hello=()=>document.querySelectorAll('.av,.avt').forEach(e=>e.textContent=ini());
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)};
const wkStart=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function thumb(pts){const st=Math.max(1,Math.floor(pts.length/90)),q=pts.filter((_,i)=>i%st===0),k=Math.cos(q[0][0]*R),xs=q.map(p=>p[1]*k),ys=q.map(p=>-p[0]);
const x0=Math.min(...xs),y0=Math.min(...ys),sc=84/Math.max(Math.max(...xs)-x0,Math.max(...ys)-y0,1e-9);
const P=q.map((p,i)=>[(xs[i]-x0)*sc+8,(ys[i]-y0)*sc+8]);
return `<svg class="th" viewBox="0 0 100 100"><polyline fill="none" stroke="#fc4c02" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="${P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="2.2" fill="#3ddc84"/><circle cx="${P[P.length-1][0]}" cy="${P[P.length-1][1]}" r="2.2" fill="#fff"/></svg>`}
const FL='<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>';
const IC={thumb:'<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8c2 0 3 1 3 3l-.5 3H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></svg>',chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',share:'<svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 11v10h14V11"/></svg>'};
const fTL=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return h?`${h}h ${m}m`:`${m}m ${c}s`};
const fDT=t=>new Date(t).toLocaleString('pt-PT',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
const wkId=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
function streakW(){const S=new Set(acts.map(a=>wkId(a.date)));let w=wkId(Date.now()),n=0;if(!S.has(w))w=wkId(w-36e5*24*3);while(S.has(w)){n++;w=wkId(w-36e5*24*3)}return n}
const ach=a=>{const lg=acts.reduce((m,x)=>x.dist>m.dist?x:m,acts[0]);return (a.dist>=5000)+(a.dist>=10000)+(a.dist>=21100)+(a===lg&&acts.length>1)};
function cal(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
const has=new Set(acts.filter(a=>{const d=new Date(a.date);return d.getFullYear()===y&&d.getMonth()===m}).map(a=>new Date(a.date).getDate()));
let h='<div class="card" style="border-radius:0;margin-bottom:8px"><b>'+n.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})+'</b><div class="cg">'+['S','T','Q','Q','S','S','D'].map(d=>`<u>${d}</u>`).join('')+'<s></s>'.repeat(f);
for(let d=1;d<=dim;d++)h+=`<span class="${has.has(d)?'on':''}">${d}</span>`;return h+'</div></div>'}
function renderWeek(){const w0=wkStart(),wa=acts.filter(a=>a.date>=w0),km=wa.reduce((q,a)=>q+a.dist,0)/1000,sw=streakW();
const dd=[0,1,2,3,4,5,6].map(i=>wa.filter(a=>Math.floor((a.date-w0)/864e5)===i).reduce((q,a)=>q+a.dist,0)/1000),dm=Math.max(...dd,1);
$('#wk').innerHTML=`<div class="car" id="car">
<div class="sl"><div class="sh"><b>A tua sequência</b><a id="vc">Ver calendário</a></div><div class="stk"><div class="fl ${sw?'on':''}"><div class="fi">${FL}<b>${sw}</b></div><div class="mu">Semanas</div></div><div class="tx">${sw?'Continua a tua sequência semanal!':'Começa a tua sequência registando uma atividade.'}</div><button class="btn pri" id="rn">Gravar agora</button></div></div>
<div class="sl"><div class="sh"><b>Esta semana</b></div><div class="row" style="margin-bottom:10px"><div><div class="big">${km.toFixed(1)}</div><div class="mu">km</div></div><div><div class="big">${wa.length}</div><div class="mu">atividades</div></div><div><div class="big">${fTL(wa.reduce((q,a)=>q+a.dur,0))}</div><div class="mu">tempo</div></div></div><div class="bar mini">${dd.map((v,i)=>`<div style="height:${v/dm*100}%"><span>${'STQQSSD'[i]}</span></div>`).join('')}</div></div>
<div class="sl"><div class="sh"><b>Meta semanal</b><a id="goal">Editar</a></div><div class="big">${km.toFixed(1)} <span class="mu">/ ${goal} km</span></div><div class="prog"><i style="width:${Math.min(100,km/goal*100)}%"></i></div><div class="mu">${km>=goal?'Meta atingida! 🎉':'Faltam '+(goal-km).toFixed(1)+' km'}</div></div></div>
<div class="dots"><i class="on"></i><i></i><i></i></div><div id="cal" class="hide"></div>`;
const car=$('#car');car.onscroll=()=>{const i=Math.round(car.scrollLeft/car.clientWidth);document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i))};
$('#vc').onclick=()=>{const c=$('#cal');c.innerHTML=cal();c.classList.toggle('hide')};
$('#rn').onclick=()=>go('rec');
$('#goal').onclick=()=>{const v=+prompt('Meta semanal (km)',goal);if(v>0){goal=v;ss('kr_goal',v);renderWeek()}}}
function renderCards(){const l=$('#list');acts.sort((a,b)=>b.date-a.date);const q=($('#q').value||'').toLowerCase(),nm=esc(ls('kr_name','Atleta'));
const f=acts.filter(a=>a.name.toLowerCase().includes(q));
l.innerHTML=f.length?'':'<p class="mu" style="padding:16px">Sem atividades. Toca em + para importar um GPX ou em Gravar.</p>';
f.forEach((a,i)=>{const c=document.createElement('div');c.className='post';c.style.animationDelay=Math.min(i,6)*60+'ms';
c.innerHTML=`<div class="ph"><span class="av">${ini()}</span><div class="pm"><b>${nm}</b><div class="mu">${fDT(a.date)}</div><div class="mu">${ICON[a.type]||'🏃'} ${a.type}</div></div></div>
<h2>${esc(a.name)}</h2>
<div class="ps"><div><span>Distância</span><b>${(a.dist/1000).toFixed(2)} km</b></div><div><span>Subida</span><b>${Math.round(a.elev)} m</b></div><div><span>Tempo</span><b>${fTL(a.dur)}</b></div><div class="r"><span>Conquistas</span><b>🏅 ${ach(a)}</b></div></div>
<div class="mapbox">${thumb(a.pts)}</div>
<div class="kd">${a.k?'Deste gosto a esta atividade':'Sê o primeiro a dar gosto!'}</div><div class="cm">${(a.c||[]).map(x=>`<p><b>${nm}</b> ${esc(x)}</p>`).join('')}</div>
<div class="ac"><button class="lk ${a.k?'on':''}">${IC.thumb}</button><button class="cmt">${IC.chat}</button><button class="shr">${IC.share}</button></div>`;
c.querySelector('h2').onclick=c.querySelector('.mapbox').onclick=()=>show(a);
c.querySelector('.lk').onclick=()=>{a.k=!a.k;save();renderCards()};
c.querySelector('.cmt').onclick=()=>{const t=prompt('Comentário');if(t){(a.c=a.c||[]).push(t.slice(0,300));save();renderCards()}};
c.querySelector('.shr').onclick=()=>{const t=`${a.name} — ${(a.dist/1000).toFixed(2)} km em ${fTL(a.dur)} #KeepRun`;if(navigator.share)navigator.share({title:'KeepRun',text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t)}catch(e){}toast('Texto copiado')}};
l.appendChild(c)})}
function renderList(){renderWeek();renderCards();hello()}
$('#q').oninput=renderCards;
$('#sb').onclick=()=>{go('feed');const b=$('#sbar');b.classList.toggle('hide');if(!b.classList.contains('hide'))$('#q').focus();else{$('#q').value='';renderCards()}};
$('#chat').onclick=()=>toast('Mensagens chegam com o backend');
$('#bell').onclick=()=>toast('Sem notificações novas');
let amap,alay;
function renderMaps(){if(!amap){amap=L.map('amap').setView([38.72,-9.14],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(amap);alay=L.layerGroup().addTo(amap)}
alay.clearLayers();const all=[];acts.forEach(a=>{const ll=a.pts.map(p=>[p[0],p[1]]);for(const p of ll)all.push(p);L.polyline(ll,{color:'#fc4c02',weight:3,opacity:.55}).addTo(alay)});
setTimeout(()=>{amap.invalidateSize();if(all.length)amap.fitBounds(all,{padding:[20,20]})},60)}
function renderGroups(){const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
const mk=acts.filter(a=>a.date>=m0.getTime()).reduce((q,a)=>q+a.dist,0)/1000,tk=acts.reduce((q,a)=>q+a.dist,0)/1000,best=Math.max(0,...acts.map(a=>a.dist))/1000;
const days=new Set(acts.map(a=>new Date(a.date).toDateString()));let st=0;const d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);while(days.has(d.toDateString())){st++;d.setDate(d.getDate()-1)}
const ch=(n,v,g)=>`<div class="card"><b>${n}</b><div class="prog"><i style="width:${Math.min(100,v/g*100)}%"></i></div><div class="mu">${Math.min(v,g).toFixed(1)} / ${g} km</div></div>`;
const bd=[['Primeiro passo',acts.length>=1],['5 km numa atividade',best>=5],['10 km numa atividade',best>=10],['Meia maratona',best>=21.1],['100 km totais',tk>=100],['3 dias seguidos',st>=3]];
$('#groups').innerHTML=`<h3>Desafios</h3>${ch('Desafio do mês: 50 km',mk,50)}${ch('Desafio 100 km',tk,100)}<div class="card"><b>Sequência</b><div class="big">${st} dia${st===1?'':'s'}</div></div>
<h3>Conquistas</h3><div class="badges">${bd.map(x=>`<div class="bdg ${x[1]?'on':''}">${x[1]?'🏅':'🔒'}<span>${x[0]}</span></div>`).join('')}</div>
<div class="card mu">Clubes e desafios partilhados com outros utilizadores chegam com o backend.</div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let map;
function show(a){go('detail');const d=$('#detail');
d.innerHTML=`<p><button class="btn" id="back">← Voltar</button></p><div class="card"><b>${esc(a.name)}</b><div class="mu">${a.type} · ${fD(a.date)}</div><div id="map"></div>
<div class="row"><div><div class="big">${(a.dist/1000).toFixed(2)} km</div></div><div><div class="big">${fT(a.dur)}</div></div><div><div class="big">${pace(a)}</div></div><div><div class="big">${Math.round(a.elev)} m</div></div></div>
<h4>Altimetria</h4><canvas id="el" width="700" height="110"></canvas><h4>Parciais por km</h4><table id="sp"></table>
<p><button class="btn" id="exp">Exportar GPX</button> <button class="btn" id="del">Apagar</button></p></div>`;
$('#back').onclick=()=>go('feed');
$('#del').onclick=()=>{if(confirm('Apagar atividade?')){acts=acts.filter(x=>x!==a);save();renderList();go('feed')}};
$('#exp').onclick=()=>exportGPX(a);
if(map)map.remove();map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
const ll=a.pts.map(p=>[p[0],p[1]]);const pl=L.polyline(ll,{color:'#fc4c02',weight:4}).addTo(map);map.fitBounds(pl.getBounds(),{padding:[20,20]});
chart(a);splits(a)}
function chart(a){const c=$('#el'),x=c.getContext('2d'),e=a.pts.map(p=>p[2]),mn=Math.min(...e),mx=Math.max(...e),r=(mx-mn)||1;
x.fillStyle='#fc4c0255';x.strokeStyle='#fc4c02';x.beginPath();x.moveTo(0,110);
e.forEach((v,i)=>x.lineTo(i/(e.length-1)*700,105-(v-mn)/r*95));x.lineTo(700,110);x.closePath();x.fill();x.stroke();
x.fillStyle='#888';x.font='12px sans-serif';x.fillText(Math.round(mx)+' m',4,12);x.fillText(Math.round(mn)+' m',4,106)}
function splits(a){let d=0,k=1,t0=a.pts[0][3],rows='<tr><th>Km</th><th>Tempo</th></tr>';
for(let i=1;i<a.pts.length;i++){d+=hav(a.pts[i-1],a.pts[i]);if(d>=k*1000){rows+=`<tr><td>${k}</td><td>${fT((a.pts[i][3]-t0)/1000)}</td></tr>`;t0=a.pts[i][3];k++}}
$('#sp').innerHTML=rows}
function exportGPX(a){const g=`<?xml version="1.0"?><gpx version="1.1" creator="KeepRun" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${esc(a.name)}</name><trkseg>`+
a.pts.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"><ele>${p[2]}</ele><time>${new Date(p[3]).toISOString()}</time></trkpt>`).join('')+'</trkseg></trk></gpx>';
const u=URL.createObjectURL(new Blob([g],{type:'application/gpx+xml'})),l=document.createElement('a');l.href=u;l.download=a.name+'.gpx';l.click()}
// Gravação
let rmap,rline,wid,tick,rp=[],t0;
$('#rstart').onclick=()=>{if(!navigator.geolocation)return alert('Sem GPS');
rp=[];t0=Date.now();$('#rstart').classList.add('hide');$('#rstop').classList.remove('hide');
if(!rmap){rmap=L.map('rmap').setView([38.72,-9.14],14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(rmap);rline=L.polyline([],{color:'#fc4c02',weight:4}).addTo(rmap)}
rline.setLatLngs([]);
wid=navigator.geolocation.watchPosition(p=>{if(p.coords.accuracy>40)return;rp.push([p.coords.latitude,p.coords.longitude,p.coords.altitude||0,p.timestamp]);
rline.addLatLng([p.coords.latitude,p.coords.longitude]);rmap.setView([p.coords.latitude,p.coords.longitude]);upd()},e=>alert('GPS: '+e.message),{enableHighAccuracy:true});
tick=setInterval(upd,1000)};
function upd(){const s=(Date.now()-t0)/1000,c=calc(rp);$('#rd').textContent=(c.dist/1000).toFixed(2);$('#rt').textContent=fT(s);$('#rp').textContent=fP(c.dist,s)}
$('#rstop').onclick=()=>{navigator.geolocation.clearWatch(wid);clearInterval(tick);$('#rstart').classList.remove('hide');$('#rstop').classList.add('hide');
if(rp.length<2)return alert('Pontos GPS insuficientes');
const ty=$('#rtype').value;acts.push({id:Date.now(),name:ty+' '+new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}),type:ty,date:rp[0][3],pts:rp,...calc(rp)});save();renderList();go('feed')};
// Estatísticas
function renderStats(){const s=$('#stats'),tot=acts.reduce((o,a)=>({d:o.d+a.dist,t:o.t+a.dur,e:o.e+a.elev}),{d:0,t:0,e:0});
const wk=[];const now=new Date();const mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
for(let i=7;i>=0;i--){const a=mon.getTime()-i*6048e5,b=a+6048e5;wk.push({l:new Date(a).toLocaleDateString('pt-PT',{day:'numeric',month:'numeric'}),v:acts.filter(x=>x.date>=a&&x.date<b).reduce((q,x)=>q+x.dist,0)/1000})}
const mx=Math.max(...wk.map(w=>w.v),1);
const runs=acts.filter(a=>a.type==='Corrida'&&a.dist>1000);const best=runs.sort((a,b)=>a.dur/a.dist-b.dur/b.dist)[0];
const longest=[...acts].sort((a,b)=>b.dist-a.dist)[0];
s.innerHTML=`<div class="card"><b>${esc(ls('kr_name','Atleta'))}</b> <button class="btn" id="nm">Mudar nome</button></div><div class="card"><div class="row"><div><div class="big">${acts.length}</div><div class="mu">atividades</div></div><div><div class="big">${(tot.d/1000).toFixed(1)}</div><div class="mu">km totais</div></div><div><div class="big">${(tot.t/3600).toFixed(1)}</div><div class="mu">horas</div></div><div><div class="big">${Math.round(tot.e)}</div><div class="mu">m subida</div></div></div></div>
<div class="card"><b>Km por semana</b><div class="bar" style="margin:14px 0 24px">${wk.map(w=>`<div style="height:${w.v/mx*100}%" title="${w.v.toFixed(1)} km"><span>${w.l}</span></div>`).join('')}</div></div>
<div class="card"><b>Recordes pessoais</b><p>Maior distância: ${longest?(longest.dist/1000).toFixed(2)+' km ('+esc(longest.name)+')':'--'}</p><p>Melhor ritmo (corrida): ${best?fP(best.dist,best.dur)+' ('+esc(best.name)+')':'--'}</p></div>`;$('#nm').onclick=()=>{const n=prompt('O teu nome',ls('kr_name','Atleta'));if(n){ss('kr_name',n.slice(0,30));renderStats();hello()}}}
function go(v){document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hide',s.id!==v));
document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='detail'?'feed':v)));window.scrollTo(0,0);
if(v==='stats')renderStats();if(v==='maps')renderMaps();if(v==='groups')renderGroups();if(v==='rec'&&rmap)setTimeout(()=>rmap.invalidateSize(),50)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
hello();renderList();
(()=>{const sp=$('#splash');let done=0;const end=()=>{if(done)return;done=1;sp.classList.add('out');setTimeout(()=>sp.remove(),700)};
sp.onclick=end;setTimeout(end,2800)})();
</script>
</body>
</html>
